# "Un motor de reglas sin pruebas se degrada en cuanto se toca" (SDD §15).
# Esto ejecuta en cada empujón las mismas tres comprobaciones que se piden en
# local, para que un pack no llegue roto a la rama principal.
name: Validación del pack y del validador

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # El validador de contenido: ninguna dependencia externa, solo la
      # biblioteca estándar.
      - name: Validador de packs (Python)
        run: python scripts/validar_pack.py

      # Paridad: la aplicación no puede dar por limpio lo que el script rechaza.
      - name: El pack real carga limpio en la aplicación
        run: node test/validar-pack-real.mjs

      - name: Casos del validador, uno por regla
        run: node test/validar-reglas.mjs
