# "Un motor de reglas sin pruebas se degrada en cuanto se toca" (SDD §15).
#
# Este flujo ejecutaba TRES de las doce comprobaciones del proyecto: las de forma
# del pack, y ninguna de procedencia. Es decir, precisamente las que no habrían
# detenido el error de derivación del 2026-08-05, que es el único que ha llegado
# al docente. Las otras existían y había que acordarse de ejecutarlas a mano.
#
# Ahora corre una sola orden, la misma que se ejecuta en local, y esa orden es la
# lista completa. Añadir una comprobación nueva es añadirla a scripts/comprobar_todo.py
# y aparece aquí sola: no hay una segunda lista que mantener.
name: Comprobación completa

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ninguna dependencia externa, ni en Python ni en Node: solo biblioteca
      # estándar. Si algún día hace falta una, se instala aquí y se dice por qué.
      #
      # El verificador de derivación necesita fuentes/curriculo/, que sí viaja en
      # el repositorio. El Marco Teórico vive en el repositorio de Lengua y no
      # viaja: esa parte de la comprobación 2 emite un aviso y sigue, que es el
      # comportamiento correcto y está probado.
      - name: Las doce comprobaciones
        run: python scripts/comprobar_todo.py
